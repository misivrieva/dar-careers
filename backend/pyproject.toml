[project]
name = "dar-careers-backend"
version = "0.1.0"
description = "DAR Careers agentic career companion - backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "anthropic>=0.60",
  "nh3>=0.2",
  "openai>=3.58.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests", "../evals"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
